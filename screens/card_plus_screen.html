<div class="scroll-content"
  style="position: relative; min-height: 100%; background-color: #ffffff; overflow-x: hidden;">

  <!-- 배경 은은한 데코 원 -->
  <div
    style="position:absolute; bottom:-110px; left:-80px; width:280px; height:280px; border-radius:50%; background: linear-gradient(135deg, #3b3d63 0%, #575a89 100%); opacity: 0.95; pointer-events:none; z-index:0;">
  </div>

  <!-- 좌우 여백 24px 보장 컨테이너 -->
  <div style="padding: 28px 24px 120px 24px; position: relative; z-index: 1;">

    <!-- 상단 헤더 -->
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
      <button type="button" onclick="loadScreen('card_screen.html')" aria-label="뒤로가기"
        style="width:36px; height:36px; border-radius:50%; border:1px solid #e5e7eb; background:#ffffff; display:flex; align-items:center; justify-content:center; font-size:18px; color:#333333; cursor:pointer;">
        ←
      </button>
      <h1 style="font-size: 22px; font-weight: 700; color: #111111; letter-spacing: -0.5px; margin: 0;">
        카드 추가하기
      </h1>
    </div>

    <!-- 실시간 실물 카드 미리보기 -->
    <div id="live-card-preview"
      style="width: 100%; height: 156px; border-radius: 20px; background: linear-gradient(135deg, #2e3052 0%, #4b4e7d 100%); padding: 22px; color: #ffffff; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 10px 24px rgba(59, 61, 99, 0.25); margin-bottom: 28px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span id="preview-bank" style="font-size: 16px; font-weight: 700; letter-spacing: -0.3px;">은행을 선택하세요</span>
        <span id="preview-type"
          style="font-size: 11px; font-weight: 600; background: rgba(255,255,255,0.18); padding: 4px 10px; border-radius: 20px;">카드
          종류</span>
      </div>
      <!-- IC 칩 모양 -->
      <div
        style="width: 36px; height: 26px; border-radius: 6px; background: linear-gradient(135deg, #f3d58d 0%, #d4af37 100%); opacity: 0.9;">
      </div>
      <div
        style="display: flex; justify-content: space-between; align-items: center; font-size: 15px; letter-spacing: 2px; font-weight: 600; color: #e2e8f0;">
        <span>•••• &nbsp; •••• &nbsp; ••••</span>
        <span id="preview-digits" style="color: #ffffff; font-weight: 700;">****</span>
      </div>
    </div>

    <!-- 입력 폼 영역 -->
    <div style="display: flex; flex-direction: column; gap: 18px;">

      <!-- 은행 이름 & 카드 종류 (2열 배치) -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label for="card-bank-name" style="font-size: 13px; font-weight: 700; color: #333333;">은행 / 카드사</label>
          <select id="card-bank-name" onchange="updateCardPreview()"
            style="width: 100%; height: 46px; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 0 12px; font-size: 14px; font-weight: 600; color: #111111; background-color: #f8fafc; outline: none;">
            <option value="" disabled selected>선택</option>
            <option value="토스뱅크">토스뱅크</option>
            <option value="카카오뱅크">카카오뱅크</option>
            <option value="국민은행">국민은행</option>
            <option value="신한은행">신한은행</option>
            <option value="우리은행">우리은행</option>
            <option value="하나은행">하나은행</option>
            <option value="농협은행">농협은행</option>
            <option value="현대카드">현대카드</option>
            <option value="삼성카드">삼성카드</option>
            <option value="롯데카드">롯데카드</option>
          </select>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label for="card-type" style="font-size: 13px; font-weight: 700; color: #333333;">카드 종류</label>
          <select id="card-type" onchange="updateCardPreview()"
            style="width: 100%; height: 46px; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 0 12px; font-size: 14px; font-weight: 600; color: #111111; background-color: #f8fafc; outline: none;">
            <option value="" disabled selected>선택</option>
            <option value="체크카드">체크카드</option>
            <option value="신용카드">신용카드</option>
            <option value="법인카드">법인카드</option>
          </select>
        </div>
      </div>

      <!-- 카드 뒷자리 (4자리) -->
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label for="card-last-digits" style="font-size: 13px; font-weight: 700; color: #333333;">카드 뒷자리 (4자리)</label>
        <input type="text" id="card-last-digits" maxlength="4" inputmode="numeric" placeholder="예: 1234"
          oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,4); updateCardPreview();"
          style="width: 100%; height: 46px; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 0 16px; font-size: 16px; font-weight: 700; letter-spacing: 4px; color: #111111; background-color: #f8fafc; outline: none;" />
      </div>

      <!-- 등록 버튼 -->
      <button type="button" onclick="submitNewCard()"
        style="margin-top: 12px; width: 100%; height: 52px; background-color: #3b3d63; color: #ffffff; border: none; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 6px 16px rgba(59, 61, 99, 0.25);">
        카드 등록하기
      </button>

    </div>
  </div>
</div>
